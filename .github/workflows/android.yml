# Builds the Android APK. On a version tag (v1.0, v1.1 …) it publishes a GitHub Release with
# the APK attached, which the download page links to (releases/latest/download/Recorder.apk).
#
# Signing (optional but recommended): add these repository secrets so every release is signed
# with the same key and updates install over the previous version:
#   RECORDER_KEYSTORE_BASE64   base64 of your .jks file
#   RECORDER_KEYSTORE_PASSWORD
#   RECORDER_KEY_ALIAS
#   RECORDER_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key.
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.RECORDER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RECORDER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: using the debug key."
          fi

      - name: Build release APK
        env:
          RECORDER_KEYSTORE_PASSWORD: ${{ secrets.RECORDER_KEYSTORE_PASSWORD }}
          RECORDER_KEY_ALIAS: ${{ secrets.RECORDER_KEY_ALIAS }}
          RECORDER_KEY_PASSWORD: ${{ secrets.RECORDER_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Recorder.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Recorder-apk
          path: Recorder.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Recorder.apk
          name: Recorder ${{ github.ref_name }} (test version)
          prerelease: false
          body: |
            **Test version** — things may change or break, and saved sessions could be lost between versions.

            Android app (Samsung and other Android 10+ phones). Download **Recorder.apk**, open it, and allow installing from this source when asked.
            iPhone: use the web app at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/app/
